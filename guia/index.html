<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de la mesa</title>
<meta name="description" content="Cómo abrir la app, crear salas y jugar con ella, para DJs y jugadores.">
<style>
:root{
  --bg:#f4f0e6; --panel:#fbf8f0; --ink:#1c1d24; --mute:#5b5e6b; --line:#d8d1bf;
  --accent:#8a1f2c; --gold:#c9a227; --nav:#1b1d26; --navink:#e6e9f0; --chip:#22242e; --chipink:#f2f4f8;
  --tip:#e4efe3; --tipline:#5a9a62; --warn:#f6e3c8; --warnline:#c9812c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14151b; --panel:#1c1e26; --ink:#e8eaf0; --mute:#a3a8b8; --line:#33364a; --accent:#e0575b; --nav:#101117; --chip:#2c2f3d; --tip:#1f3022; --warn:#3a2c17; }
}
:root[data-theme="dark"]{ --bg:#14151b; --panel:#1c1e26; --ink:#e8eaf0; --mute:#a3a8b8; --line:#33364a; --accent:#e0575b; --nav:#101117; --chip:#2c2f3d; --tip:#1f3022; --warn:#3a2c17; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
header.top{position:sticky;top:0;z-index:5;background:var(--nav);color:var(--navink);display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:3px solid var(--gold)}
header.top h1{font:700 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:0;flex:1}
button,.btn{font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--chipink);border-radius:4px;padding:7px 12px}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#menu{display:none}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1100px;margin:0 auto}
nav#nav{padding:18px 12px 40px 16px;position:sticky;top:55px;align-self:start;max-height:calc(100vh - 55px);overflow:auto;font:15px/1.3 "Segoe UI",system-ui,sans-serif}
nav h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px}
nav h2:first-child{margin-top:0}
nav a{display:block;padding:7px 10px;border-radius:4px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
nav a:hover{background:var(--panel)}
nav a[aria-current="page"]{background:var(--panel);border-left-color:var(--accent);font-weight:700}
main{padding:28px 24px 80px;min-width:0}
.crumb{font:700 11px "Segoe UI",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h2.title{font:700 30px/1.15 "Segoe UI",system-ui,sans-serif;margin:0 0 10px}
.lead{font-size:19px;color:var(--ink);margin:0 0 20px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 18px}
ol.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 52px;margin:0 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font:700 15px/28px "Segoe UI",system-ui,sans-serif;text-align:center}
ul.list{padding:0;margin:0 0 18px;list-style:none}
ul.list li{padding:8px 12px;margin:0 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.chip{display:inline-block;font:700 .78em "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);color:var(--chipink);border-radius:3px;padding:2px 7px;margin:0 1px;white-space:nowrap}
.note{border-left:5px solid var(--tipline);background:var(--tip);padding:10px 14px;border-radius:4px;margin:0 0 14px}
.note.warn{border-left-color:var(--warnline);background:var(--warn)}
.note b.tag{font:700 11px "Segoe UI",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:15px;background:var(--panel)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font:700 12px "Segoe UI",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.url{display:block;font:700 18px/1.3 "Segoe UI",system-ui,sans-serif;word-break:break-all;background:var(--panel);border:2px dashed var(--accent);border-radius:6px;padding:14px;margin:0 0 18px;color:var(--accent);text-decoration:none;text-align:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pager a{flex:1;max-width:48%;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:600 15px "Segoe UI",system-ui,sans-serif}
.pager a small{display:block;font-weight:400;color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pager a.next{text-align:right;margin-left:auto}
.pager a:hover{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0 0 18px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card:hover{border-color:var(--accent)}
.card b{display:block;font:700 18px "Segoe UI",system-ui,sans-serif;margin-bottom:4px}
.card span{color:var(--mute);font-size:15px}
svg.diagram{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 18px}
svg.diagram text{font:600 13px "Segoe UI",system-ui,sans-serif;fill:var(--ink)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  #menu{display:inline-block}
  nav#nav{display:none;position:fixed;inset:55px 0 0 0;max-height:none;background:var(--bg);z-index:4;padding:14px 16px 60px}
  nav#nav.open{display:block}
  main{padding:20px 16px 80px}
  h2.title{font-size:25px}
  .lead{font-size:17px}
}
@media print{header.top,nav#nav,.pager{display:none}.layout{display:block}}
</style>
</head>
<body>
<header class="top">
  <button id="menu" aria-expanded="false" aria-controls="nav"></button>
  <h1 id="brand"></h1>
  <button id="lang" aria-label="Language"></button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Secciones"></nav>
  <main id="main" tabindex="-1"></main>
</div>

/* --------------------------------------------------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
let lang = (new URLSearchParams(location.search).get("lang") || localStorage.getItem("guide-lang") || (navigator.language || "es")).slice(0, 2) === "en" ? "en" : "es";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/** A button name: [[es|en]] shows the one for the reader's language; [[X]] is the same in both. */
const md = s => esc(s)
  .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, b) => `<span class="chip">${b ? (lang === "en" ? b : a) : a}</span>`)
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const tx = o => (o && typeof o === "object" && !Array.isArray(o) ? (o[lang] ?? o.es) : o);
const byId = id => PAGES.find(p => p.id === id);

function diagram() {
  const L = lang === "en"
    ? { hdr: "Header", left: "Characters", mid: "Sheet", tabs: "Tabs", pane: "Log, Map, Handouts…", btn: "Room · Export…" }
    : { hdr: "Cabecera", left: "Personajes", mid: "Ficha", tabs: "Pestañas", pane: "Historial, Mapa, Documentos…", btn: "Sala · Exportar…" };
  return `<svg class="diagram" viewBox="0 0 640 330" role="img" aria-label="${esc(tx({ es: "Esquema de la pantalla", en: "Screen layout" }))}">
    <rect x="8" y="8" width="624" height="42" rx="6" fill="#1b1d26"/>
    <text x="22" y="34" style="fill:#e6e9f0">Project Moon: The City</text>
    <text x="330" y="34" style="fill:#e6e9f0">${esc(L.btn)}</text><text x="590" y="34" style="fill:#c9a227">ES|EN</text>
    <rect x="8" y="58" width="130" height="264" rx="6" fill="#272a36"/><text x="22" y="86" style="fill:#e6e9f0">${esc(L.left)}</text>
    <rect x="22" y="100" width="102" height="26" rx="4" fill="#3a3e50"/><rect x="22" y="132" width="102" height="26" rx="4" fill="#3a3e50"/><rect x="22" y="164" width="102" height="26" rx="4" fill="#3a3e50"/>
    <rect x="146" y="58" width="270" height="264" rx="6" fill="#f4f0e6" stroke="#c9a227" stroke-width="2"/>
    <text x="164" y="92" style="font-size:20px">${esc(L.mid)}</text>
    <rect x="164" y="108" width="234" height="14" rx="3" fill="#d8d1bf"/><rect x="164" y="132" width="234" height="14" rx="3" fill="#d8d1bf"/><rect x="164" y="156" width="150" height="14" rx="3" fill="#d8d1bf"/>
    <rect x="424" y="58" width="208" height="264" rx="6" fill="#20222a"/>
    <rect x="424" y="58" width="208" height="30" rx="6" fill="#33364a"/><text x="436" y="78" style="fill:#e6e9f0">${esc(L.tabs)}</text>
    <text x="436" y="116" style="fill:#e6e9f0">${esc(L.pane)}</text>
    <rect x="436" y="132" width="184" height="42" rx="4" fill="#33364a"/><rect x="436" y="182" width="184" height="42" rx="4" fill="#33364a"/><rect x="436" y="232" width="184" height="42" rx="4" fill="#33364a"/>
  </svg>`;
}

function pageHtml(p, i) {
  const out = [`<p class="crumb">${esc(tx(GROUPS[p.group]))}</p><h2 class="title">${esc(tx(p.title))}</h2>`];
  if (p.lead) out.push(`<p class="lead">${md(tx(p.lead))}</p>`);
  if (p.url) out.push(`<a class="url" href="${APP}" target="_blank" rel="noopener">${APP}</a>`);
  if (p.diagram) out.push(diagram());
  if (p.cards) out.push(`<div class="cards">${p.cards.map(c => `<a class="card" href="#/${c.to}"><b>${esc(tx(c.t))}</b><span>${esc(tx(c.d))}</span></a>`).join("")}</div>`);
  if (p.steps) out.push(`<ol class="steps">${tx(p.steps).map(s => `<li>${md(s)}</li>`).join("")}</ol>`);
  if (p.list) out.push(`<ul class="list">${tx(p.list).map(s => `<li>${md(s)}</li>`).join("")}</ul>`);
  if (p.table) out.push(`<table><thead><tr>${tx(p.table.head).map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tx(p.table.rows).map(r => `<tr>${r.map(c => `<td>${md(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
  for (const n of p.notes ?? []) out.push(`<div class="note ${n.type === "warn" ? "warn" : ""}"><b class="tag">${esc(UI[lang][n.type === "warn" ? "warn" : "tip"])}</b>${md(tx(n))}</div>`);
  const prev = PAGES[i - 1], next = PAGES[i + 1];
  out.push(`<div class="pager">${prev ? `<a class="prev" href="#/${prev.id}"><small>${esc(UI[lang].prev)}</small>${esc(tx(prev.title))}</a>` : "<span></span>"}${next ? `<a class="next" href="#/${next.id}"><small>${esc(UI[lang].next)}</small>${esc(tx(next.title))}</a>` : ""}</div>`);
  return out.join("");
}

function navHtml(current) {
  let last = "", html = "";
  for (const p of PAGES) {
    if (p.group !== last) { html += `<h2>${esc(tx(GROUPS[p.group]))}</h2>`; last = p.group; }
    html += `<a href="#/${p.id}" ${p.id === current ? 'aria-current="page"' : ""}>${esc(tx(p.title))}</a>`;
  }
  return html;
}

function render() {
  const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || "inicio";
  const i = Math.max(0, PAGES.findIndex(p => p.id === id)), p = PAGES[i];
  document.documentElement.lang = lang;
  document.title = `${tx(p.title)} · ${UI[lang].brand}`;
  $("#brand").textContent = UI[lang].brand;
  $("#lang").textContent = UI[lang].lang;
  $("#menu").textContent = UI[lang].menu;
  $("#nav").innerHTML = navHtml(p.id);
  $("#main").innerHTML = pageHtml(p, i);
  $("#nav").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0); $("#main").focus({ preventScroll: true });
}
window.addEventListener("hashchange", render);
$("#lang").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem("guide-lang", lang); } catch { /* private window */ } render(); });
$("#menu").addEventListener("click", () => { const open = $("#nav").classList.toggle("open"); $("#menu").setAttribute("aria-expanded", String(open)); });
render();
</script>
