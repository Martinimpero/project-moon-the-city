<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14151b">
<title>Project Moon: The City</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314151b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9a227' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body data-view="sheet">
<header id="top">
  <div class="brand"><h1 id="t-title">Project Moon: The City</h1><p id="t-sub"></p></div>
  <div id="timer-chip" hidden data-action="timerGo" title="Turn timer"></div>
  <nav class="top-actions">
    <span class="sound"><button type="button" data-action="sound" id="b-sound">Sound</button><input type="range" id="vol" min="0" max="100" step="5" aria-label="Volume"></span>
    <button type="button" data-action="backups" id="b-backup">Backup</button>
    <button type="button" data-action="export" id="b-export">Export</button>
    <button type="button" data-action="import" id="b-import">Import</button>
    <button type="button" data-action="room" id="b-room" class="room">Room</button>
    <button type="button" data-action="help" id="b-help">Help</button>
    <button type="button" data-action="lang" id="lang" class="lang">ES</button>
  </nav>
</header>
<div id="netbar" hidden></div>
<div id="warnbar" hidden></div>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
  <aside id="log">
    <div class="log-head"><nav id="rtabs"></nav><button type="button" data-action="clearLog" id="b-clearlog">Clear log</button></div>
    <div id="pane-log" class="pane"><div id="log-list"></div>
      <form id="chat" hidden><select id="chat-to" hidden></select><input id="chat-text" type="text" maxlength="400" autocomplete="off"><button type="submit" id="chat-send">Send</button></form></div>
    <div id="pane-xchg" class="pane" hidden></div>
    <div id="pane-map" class="pane" hidden></div>
    <div id="pane-ho" class="pane" hidden></div>
    <div id="pane-jr" class="pane" hidden></div>
  </aside>
</div>
<nav id="phone-tabs"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<input type="file" id="mapfile" accept="image/*" hidden>
<script type="module" src="js/main.mjs"></script>
</body>
</html>
